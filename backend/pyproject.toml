[project]
name = "society-resident-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3",
  "PyJWT>=2.10,<3", "python-multipart>=0.0.20", "httpx>=0.28,<1",
  "boto3>=1.36,<2", "reportlab>=4.3,<5", "Pillow>=11,<13"
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
