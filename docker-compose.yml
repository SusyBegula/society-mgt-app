services:
  # Local PostgreSQL container (optional; use '--profile local-db' to launch locally)
  db:
    image: postgres:17-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: society
      POSTGRES_USER: society
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-society}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U society -d society"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  push-worker:
    build: ./backend
    profiles: ["workers"]
    env_file: ./backend/.env
    depends_on: [api]
    restart: unless-stopped
    command: python -m app.push_worker
  maintenance-worker:
    build: ./backend
    profiles: ["workers"]
    env_file: ./backend/.env
    depends_on: [api]
    restart: unless-stopped
    command: python -m app.maintenance_worker
volumes:
  postgres_data:
  uploads:
